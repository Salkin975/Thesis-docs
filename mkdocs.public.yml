# The explainer pages, one per change: changes/.
# Published at the root of the GitHub Pages site by .github/workflows/pages.yml.
# Preview: mkdocs serve -f mkdocs.public.yml
site_name: Columnar MLT in MapLibre GL JS
site_description: What the thesis changes in @maplibre/mlt and MapLibre GL JS, why, and what each change is worth
site_url: https://salkin975.github.io/Thesis-docs/
repo_url: https://github.com/Salkin975/Thesis-docs
repo_name: Salkin975/Thesis-docs
edit_uri: ""

docs_dir: changes
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Links to the other site (overview/ <-> changes/) point to its published pages;
# any other link that leaves docs_dir fails the strict build.
hooks:
  - hooks/site_links.py

extra:
  sites:
    changes: https://salkin975.github.io/Thesis-docs/
    overview: https://salkin975.github.io/Thesis-docs/overview/

nav:
  - Overview: index.md
  - The architecture in a few pages: https://salkin975.github.io/Thesis-docs/overview/
  - "@maplibre/mlt":
      - 1. Selection vectors: 01-selection-vectors.md
      - 2. Filter engine: 02-filter-engine.md
      - 3. Lazy decoding: 03-lazy-decoding.md
      - 4. Adapter primitives: 04-adapter-primitives.md
      - 5. Decode performance: 05-decode-performance.md
  - MapLibre GL JS:
      - 6. MLT facade: 06-mlt-facade.md
      - 7. Dispatch and hand-off: 07-dispatch.md
      - 8. Shared populate pipeline: 08-populate-pipeline.md
      - 9. Fill bucket: 09-fill-bucket.md
      - 10. Line bucket: 10-line-bucket.md
      - 11. Symbol bucket: 11-symbol-bucket.md
      - 12. Worker performance: 12-worker-performance.md
  - Method:
      - 13. How it was measured: 13-measuring.md
