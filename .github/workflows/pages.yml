name: pages

# Publishes both sites to GitHub Pages: the explainer pages (mkdocs.public.yml)
# at the root, the overview (mkdocs.overview.yml) under overview/.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      # --strict: a broken link fails the build. The explainer pages go first,
      # since their build empties site/; the overview then goes into site/overview/.
      - run: mkdocs build --strict -f mkdocs.public.yml
        env:
          NO_MKDOCS_2_WARNING: "1"
      - run: mkdocs build --strict -f mkdocs.overview.yml
        env:
          NO_MKDOCS_2_WARNING: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
