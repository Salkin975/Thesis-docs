# The top-level overview for MapLibre maintainers: overview/.
# Published under overview/ of the GitHub Pages site by .github/workflows/pages.yml.
# Preview: mkdocs serve -f mkdocs.overview.yml
site_name: Columnar MLT in MapLibre, the overview
site_description: The architecture of the columnar MLT path in @maplibre/mlt and MapLibre GL JS, in a few pages
site_url: https://salkin975.github.io/Thesis-docs/overview/
repo_url: https://github.com/Salkin975/Thesis-docs
repo_name: Salkin975/Thesis-docs
edit_uri: ""

docs_dir: overview
site_dir: site/overview

theme:
  name: material
  language: en
  features:
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode

plugins:
  - search
  # Renders the .drawio diagrams in overview/img/.
  - drawio

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Links to the other site (overview/ <-> changes/) point to its published pages;
# any other link that leaves docs_dir fails the strict build.
hooks:
  - hooks/site_links.py

extra:
  sites:
    changes: https://salkin975.github.io/Thesis-docs/
    overview: https://salkin975.github.io/Thesis-docs/overview/

nav:
  - In five minutes: index.md
  - How a tile is parsed: architecture.md
  - "@maplibre/mlt": mlt-package.md
  - MapLibre GL JS: gl-js.md
  - Results: results.md
  - Decisions and open questions: decisions.md
  - Review feedback: feedback.md
  - The changes, page by page: https://salkin975.github.io/Thesis-docs/
