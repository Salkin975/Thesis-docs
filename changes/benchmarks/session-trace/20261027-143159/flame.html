:root {

  --more: #e34948; --less: #2a78d6; --same: #d6d5cf;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface: #1a1a19; --panel: #242423; --border: #3a3a38; --text: #f0efec; --text2: #c3c2b7; --muted: #8f8e88;
    --g-MLT: #3987e5; --g-MVT-row: #d95926; --g-earcut: #199e70; --g-symbols: #c98500; --g-expressions: #d55181;
    --g-transfer: #9085e9; --g-filter: #008300; --g-gc: #5c5b57; --g-instr: #4a4a47; --g-other: #4f4e4b;
    --more: #e66767; --less: #3987e5; --same: #4a4a47;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface); color: var(--text); font: 13px/1.4 system-ui, "Segoe UI", sans-serif; }
header { padding: 12px 16px 8px; border-bottom: 1px solid var(--border); }
h1 { font-size: 16px; margin: 0 0 8px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.controls label { color: var(--text2); display: flex; gap: 6px; align-items: center; }
select, input[type=search], button { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 3px 6px; }
button { cursor: pointer; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; min-height: calc(100vh - 92px); }
#chartwrap { padding: 8px 16px 16px; overflow-x: hidden; }
#crumbs { color: var(--text2); margin: 4px 0 8px; min-height: 18px; }
#crumbs a { color: var(--text); cursor: pointer; text-decoration: underline; }
#chart { position: relative; width: 100%; }
.f { position: absolute; height: 17px; overflow: hidden; white-space: nowrap; font-size: 11px; line-height: 17px; padding: 0 3px;
     border-right: 1px solid var(--surface); border-bottom: 1px solid var(--surface); cursor: pointer; color: #0b0b0b; border-radius: 2px; }
.f.dim { opacity: .25; }
.f.hit { outline: 2px solid var(--text); outline-offset: -2px; }
aside { border-left: 1px solid var(--border); background: var(--panel); padding: 12px 14px; overflow-y: auto; max-height: calc(100vh - 92px); }
aside h2 { font-size: 13px; margin: 0 0 6px; }
aside table { width: 100%; border-collapse: collapse; font-size: 12px; }
aside td, aside th { padding: 2px 4px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
aside td.num, aside th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; color: var(--text2); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
#tip { position: fixed; pointer-events: none; background: var(--surface); color: var(--text); border: 1px solid var(--border);
       border-radius: 4px; padding: 6px 8px; font-size: 12px; box-shadow: 0 2px 8px #0003; display: none; max-width: 460px; z-index: 5; }
.src { color: var(--muted); word-break: break-all; }
.pos { color: var(--more); } .neg { color: var(--less); }
.note { color: var(--text2); font-size: 12px; margin-top: 10px; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } aside { border-left: 0; border-top: 1px solid var(--border); max-height: none; } }
</style>
</head>

  <div class="legend" id="legend"></div>
</header>

function selfByFunction(n, acc = new Map()) {
  if (n.self > 0) { const k = n.n + "@" + n.s; const a = acc.get(k) ?? {n: n.n, s: n.s, c: n.c, v: 0}; a.v += n.self; acc.set(k, a); }
  (n.ch ?? []).forEach(c => selfByFunction(c, acc));
  return acc;
}
function selfByPhase(n, acc = new Map()) {
  if (n.self > 0) acc.set(n.c, (acc.get(n.c) ?? 0) + n.self);
  (n.ch ?? []).forEach(c => selfByPhase(c, acc));
  return acc;
}

function side(focus, root, baseRoot, variant, cmp) {
  const vName = DATA.variants[variant], cName = cmp ? DATA.variants[cmp] : null;
  let baseFocus = null;
  if (baseRoot) { annotate(baseRoot, null); baseFocus = findPath(baseRoot, focus._path); annotate(root, index(baseRoot)); }
  const fns = [...selfByFunction(focus).values()].sort((a, b) => b.v - a.v).slice(0, 25);
  const baseFns = baseFocus ? selfByFunction(baseFocus) : new Map();
  const phases = [...selfByPhase(focus).entries()].sort((a, b) => b[1] - a[1]);
  const basePhases = baseFocus ? selfByPhase(baseFocus) : new Map();
  let h = `<h2>${esc(focus.n)}</h2><div class="src">${esc(focus.s || "")}</div>` +
    `<p>${fmt(focus.v)} ms per run in ${esc(vName)}` + (baseFocus ? `, ${fmt(baseFocus.v)} ms in ${esc(cName)} at the same path` : cName ? `; this path does not exist in ${esc(cName)}` : "") + `.</p>`;
  h += `<h2>Self time by phase under this frame</h2><table><tr><th>phase</th><th class="num">${esc(vName)}</th>${cName ? `<th class="num">${esc(cName)}</th>` : ""}</tr>` +
    phases.map(([c, v]) => `<tr><td><span class="sw" style="background:var(${GROUP_VAR[DATA.groups[c] ?? "other"]})"></span>${esc(c)}</td><td class="num">${fmt(v)}</td>${cName ? `<td class="num">${baseFocus ? fmt(basePhases.get(c) ?? 0) : "–"}</td>` : ""}</tr>`).join("") + `</table>`;
  h += `<h2 style="margin-top:12px">Top functions by self time under this frame</h2><table><tr><th>function</th><th class="num">${esc(vName)}</th>${cName ? `<th class="num">${esc(cName)}*</th>` : ""}</tr>` +
    fns.map(f => `<tr><td>${esc(f.n)}<div class="src">${esc(f.s || "(native)")}</div></td><td class="num">${fmt(f.v)}</td>${cName ? `<td class="num">${baseFocus ? fmt(baseFns.get(f.n + "@" + f.s)?.v ?? 0) : "–"}</td>` : ""}</tr>`).join("") + `</table>`;
  if (cName) h += `<p class="note">* the same function (name and source file) under the matching frame in ${esc(cName)}. Red frames take more time than in ${esc(cName)} at the same call path, blue less; frames that only exist in one variant count fully.</p>`;
  h += `<p class="note">ms = mean per run of sampled self time (CPU samples every ~0.65 ms). Frames below 0.05 % of the total are hidden; their time stays in the parent.</p>`;
  $("side").innerHTML = h;
}

["session", "window", "variant", "compare", "match"].forEach(id => $(id).onchange = () => { state.zoom = null; render(); });
$("search").oninput = render;
$("reset").onclick = () => { state.zoom = null; render(); };
addEventListener("resize", render);
render();
</script>
</body>
</html>
